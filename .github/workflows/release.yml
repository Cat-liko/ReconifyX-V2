name: Release

# 打 vX.Y.Z 标签触发发布；workflow_dispatch 用于手动重跑构建。
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# 默认最小权限；写权限只给真正需要创建 Release 的 job。
permissions:
  contents: read

jobs:
  build-exe:
    name: build Windows exe
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # ReconifyX.spec 已声明 datas=[('app/static', 'app/static')]，
      # 单文件 exe 会把静态前端一起打进去。
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ReconifyX.spec

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconifyX-windows-x64
          path: dist/ReconifyX.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build-exe
    # workflow_dispatch 从分支手动触发时没有 tag，无法创建 Release：
    # 只构建、不发布，避免这一步必然失败。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: ReconifyX-windows-x64
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ReconifyX.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
